name: Refresh public data and news

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-public-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Refresh data and news snapshots
        run: npm run refresh:data

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Open or update data refresh PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/refresh-public-data
          delete-branch: true
          commit-message: "chore: refresh public data and news snapshots"
          title: "chore: refresh public data and news snapshots"
          body: |
            Monthly refresh of the checked-in public data and news snapshots.

            Updated files:
            - `src/data/fiscal.ts`
            - `src/data/elections.ts`
            - `src/data/contracts.ts`
            - `src/data/barangayMap.ts`
            - `src/data/news.ts`
            - `public/news/*.jpg`

            Generated by `npm run refresh:data` from the data.bettergov.ph and
            City Government of San Fernando sources.
          add-paths: |
            src/data/fiscal.ts
            src/data/elections.ts
            src/data/contracts.ts
            src/data/barangayMap.ts
            src/data/news.ts
            public/news
